# Placeholders __DOMAIN__, __CERT__ and __KEY__ are filled in by bootstrap-server.sh.
# Behind Cloudflare, /etc/nginx/conf.d/cloudflare-realip.conf (made by cloudflare-realip.sh) restores the visitor IP.
upstream narizmart {
    server unix:/run/narizmart/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;   # "http2 on;" needs Nginx 1.25.1+; this form works everywhere
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # one upload (photo ZIP / bulk photos) up to 100 MB; Cloudflare's free plan also stops request bodies above 100 MB
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # content-hashed files never change, so browsers may keep them for a year
    location /static/ {
        alias /srv/narizmart/shared/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # product photos and WebP renditions
    location /media/ {
        alias /srv/narizmart/shared/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'";
        access_log off;
    }

    location / {
        proxy_pass http://narizmart;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # overwrite (don't append) so the rightmost value is always the real client address the app trusts
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
