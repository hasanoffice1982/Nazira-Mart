<form hx-post="{% url 'core:newsletter' %}" hx-swap="outerHTML" class="newsletter-form">{% if done %}<p class="nl-ok">{% if created %}Thank you — you're on the list ✓{% else %}You're already subscribed ✓{% endif %}</p>{% else %}<input type="text" name="hp_contact" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><input type="email" name="email" required placeholder="Enter your email address" aria-label="Email address"><button type="submit">Join the list <span aria-hidden="true">↗</span></button>{% if error %}<small class="err nl-err">{{ error }}</small>{% endif %}{% endif %}</form>
