{% load richtext %}<section class="container story-section"><div class="story-image">{% include "components/media.html" with image=site.story_image art=site.story_art alt=site.story_title %}</div><div class="story-copy"><div class="section-label">{{ site.story_label }}</div><h2>{{ site.story_title }}<br><span style="color:#41978c">{{ site.story_highlight }}</span></h2><div class="rich">{{ site.story_text|rich }}</div><div class="story-list">{% for pt in site.story_point_list %}<span><span data-icon="check-circle"></span> {{ pt }}</span>{% endfor %}</div></div></section>
