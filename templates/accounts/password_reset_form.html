{% extends "base.html" %}
{% block title %}Reset password — NarizMart{% endblock %}
{% block content %}
<section class="container auth-wrap"><div class="auth-card"><h1>Forgot your password?</h1><p class="muted">Enter your email and we'll send you a link to choose a new one.</p>
<form method="post" novalidate>{% csrf_token %}{% include "components/form_fields.html" %}<button class="btn btn-dark btn-full" type="submit">Send reset link</button></form>
<p class="center"><a href="{% url 'accounts:login' %}">← Back to sign in</a></p></div></section>
{% endblock %}
