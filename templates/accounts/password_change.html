{% extends "base.html" %}
{% block title %}Change password — NarizMart{% endblock %}
{% block content %}
<section class="container auth-wrap"><div class="auth-card"><h1>Change password</h1><p class="muted">Other devices will be signed out.</p>
<form method="post" novalidate>{% csrf_token %}{% include "components/form_fields.html" %}<button class="btn btn-dark btn-full" type="submit">Update password</button></form>
<p class="center"><a href="{% url 'accounts:account' %}">← Back to account</a></p></div></section>
{% endblock %}
