<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;color:#17272b"><h2 style="margin:0 0 12px">Reset your password</h2><p>Hi{% if user.first_name %} {{ user.first_name }}{% endif %}, we received a request to reset your {{ brand }} password. This link is valid for 24 hours.</p><p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#101e2d;color:#fff;padding:12px 22px;border-radius:9px;text-decoration:none;font-weight:bold">Choose a new password</a></p><p style="color:#718180;font-size:13px">If you didn't ask for this, you can ignore this email — your password won't change.</p></div>
