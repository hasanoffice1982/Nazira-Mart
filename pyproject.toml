[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = ["migrations", ".venv", "staticfiles", "media"]

[tool.ruff.lint]
# Correctness-focused: syntax errors, undefined names, unused imports/variables, bugbear-style pitfalls.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E741", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E702", "F841"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
